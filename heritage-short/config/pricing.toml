[models."@cf/black-forest-labs/flux-2-klein-4b"]
# Cloudflare Workers AI pricing (developers.cloudflare.com/workers-ai/platform/pricing, checked
# 2026-11-25): $0.011 per 1,000 neurons; klein costs 26.05 neurons per 512x512 output tile. A
