[project]
name = "heritage-short"
version = "0.1.0"
description = "A small studio in code: storyboard.json in, a 60–90 second heritage film out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pillow>=10.1",
]

[project.optional-dependencies]
# Real providers (unit U3). Not needed to rebuild the film from a clean clone.
providers = [
  "google-genai>=1.0",
  "requests>=2.31",
  "kaggle>=2.2",
  "six",                 # kaggle 2.2.5 imports it without declaring it
]

[project.scripts]
film = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
